<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shelldev</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a; --panel: #1c1f25; --panel-focus: #1f232a; --border: #2c313a;
    --text: #d7dae0; --muted: #7f8794; --error: #ff7b72; --ok: #7ee787; --label: #e5c07b; --hit: #ffd43b;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 16px; margin: 0 8px 0 0; font-family: var(--mono); }
  label { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  select, input {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; font: 13px var(--mono);
  }
  input { width: 12em; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 12px; font: 13px system-ui, sans-serif; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .6; cursor: progress; }
  .export { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .export .sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
  .export a { line-height: 0; }
  button.primary { background: #2d4f73; border-color: #3d6a99; }
  button.primary:hover { border-color: var(--text); }

  dialog {
    width: min(36em, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
    padding: 0; border: 1px solid var(--border);
    border-radius: 8px; background: var(--panel); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog form { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; }
  dialog h2 { margin: 0; font-size: 16px; }
  dialog .field { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  dialog .field input:not([type=file]), dialog .field select { width: 100%; }
  dialog input[type=radio], dialog input[type=file] { width: auto; padding: 0; border: 0; background: none; }
  dialog textarea {
    resize: vertical; min-height: 6em; scrollbar-color: var(--border) transparent; padding: 8px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text); font: 12px/1.4 var(--mono); white-space: pre;
  }
  dialog fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  dialog legend { color: var(--muted); padding: 0; margin-bottom: 6px; }
  dialog fieldset label { color: var(--text); }
  dialog .error { color: var(--error); margin: 0; font: 12px var(--mono); }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .hint { font-weight: 400; text-transform: none; letter-spacing: normal; margin-left: auto; }
  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 1px; background: var(--border);
  }
  @media (max-width: 980px) { main { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { main { grid-template-columns: 1fr; } }
  .pane { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .pane h2 {
    margin: 0; padding: 6px 12px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    border-bottom: 1px solid var(--border); display: flex; gap: 12px;
  }

  /* Each editor is a transparent textarea over a <pre> that draws the
     colored text, since a textarea can't color individual lines. */
  .editor { position: relative; flex: 1; min-height: 200px; }
  .editor pre, .editor textarea {
    position: absolute; inset: 0; margin: 0; border: 0; padding: 12px;
    font: 14px/1.5 var(--mono); white-space: pre; tab-size: 8;
    overflow: auto; letter-spacing: normal; word-spacing: normal;
  }
  .editor pre { color: var(--text); background: var(--panel); overflow: hidden; pointer-events: none; }
  .editor textarea {
    resize: none; outline: 0; background: transparent;
    scrollbar-color: var(--border) transparent;
    color: transparent; caret-color: var(--text);
  }
  .editor textarea::selection { background: rgba(108, 182, 255, .35); }
  .editor:focus-within pre { background: var(--panel-focus); }
  .editor textarea.plain { color: var(--text); background: var(--panel); caret-color: var(--text); }
  .editor textarea.plain::placeholder { color: var(--muted); }
  .bad { color: var(--error); }

  .body { flex: 1; display: flex; min-height: 0; }
  .gutter {
    margin: 0; padding: 12px 10px 12px 12px; overflow: hidden;
    font: 14px/1.5 var(--mono); white-space: pre; text-align: right;
    color: var(--muted); background: var(--bg); border-right: 1px solid var(--border);
    user-select: none; flex: none;
  }
  .unknown { color: var(--error); opacity: .75; }
  /* Only color changes here: bold or italic could change glyph widths and
     knock the colored layer out of line with the textarea. */
  .label { color: var(--label); }
  .label-ref { color: var(--label); opacity: .75; }
  .comment { color: var(--muted); }

  footer {
    padding: 6px 16px; border-top: 1px solid var(--border);
    font: 12px var(--mono); color: var(--muted); min-height: 2em;
  }
  footer.error { color: var(--error); }
  footer.ok { color: var(--ok); }

  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
  }
  .bar input { flex: 1 1 20em; width: auto; min-width: 0; }
  .bar input.invalid { border-color: var(--error); }
  #hl-parsed { font: 12px var(--mono); color: var(--muted); }
  #hl-parsed.error { color: var(--error); }
  /* Faux bold via text-shadow: real bold can change glyph widths and break
     the overlay's alignment with the textarea. */
  .hit {
    color: var(--hit); text-decoration: underline;
    text-shadow: .45px 0 0 currentColor, -.45px 0 0 currentColor;
  }
</style>
</head>
<body>
<header>
  <h1>shelldev</h1>
  <label>Arch
    <select id="arch">
      <option value="x86">x86 (32-bit)</option>
      <option value="x64" selected>x64</option>
      <option value="arm64">ARM64</option>
    </select>
  </label>
  <label>Base address <input id="address" value="0x1000" spellcheck="false" autocomplete="off"></label>
  <div class="export">
    <a id="library-link" href="/library"><button type="button">Library</button></a>
    <span class="sep" aria-hidden="true"></span>
    <button id="import-open">Import…</button>
    <span class="sep" aria-hidden="true"></span>
    <label for="export-format">Export</label>
    <select id="export-format">
      <option value="bin">Raw binary (.bin)</option>
      <option value="asm" id="export-asm">NASM (.asm)</option>
      <option value="python">Python string (.py)</option>
      <option value="ruby">Ruby string (.rb)</option>
    </select>
    <button id="export">Download</button>
  </div>
</header>
<div class="bar">
  <label for="hl">Highlight bytes</label>
  <input id="hl" spellcheck="false" autocomplete="off"
         placeholder="e.g. \x00\x0a 0x0d /bin/sh"
         title="ASCII characters, \xNN or 0xNN. Spaces and commas separate entries; use \x20 for a space, \x2c for a comma, \\ for a backslash.">
  <span id="hl-parsed"></span>
</div>
<main>
  <section class="pane">
    <h2>Assembly <span class="hint">// comments · ; separates instructions</span></h2>
    <div class="body">
    <pre class="gutter" id="gutter" aria-hidden="true"></pre>
    <div class="editor">
      <pre id="asm-view" aria-hidden="true"></pre>
      <textarea id="asm" spellcheck="false" autofocus>main:
  push rbp
  mov rbp, rsp
  xor eax, eax
loop:
  inc eax
  cmp eax, 10
  jl loop
  pop rbp
  ret</textarea>
    </div>
    </div>
  </section>
  <section class="pane">
    <h2>Bytes</h2>
    <div class="editor">
      <pre id="hex-view" aria-hidden="true"></pre>
      <textarea id="hex" spellcheck="false"></textarea>
    </div>
  </section>
  <section class="pane">
    <h2>Comments <span class="hint">per line · saved in this browser</span></h2>
    <div class="editor">
      <textarea id="comments" class="plain" spellcheck="false" placeholder="notes for each line…"></textarea>
    </div>
  </section>
</main>
<footer id="status"></footer>
<dialog id="import-dialog" aria-labelledby="import-title">
  <form id="import-form">
    <h2 id="import-title">Import</h2>
    <label class="field">File
      <input type="file" id="import-file">
    </label>
    <label class="field">Or paste the file's contents
      <textarea id="import-text" spellcheck="false" placeholder='buf = b"\x48\x31\xff"'></textarea>
    </label>
    <label class="field">Format
      <select id="import-format" required>
        <option value="">Choose a format…</option>
        <option value="bin">Raw binary (.bin)</option>
        <option value="nasm">NASM (.asm)</option>
        <option value="gas">GNU as (.s)</option>
        <option value="python">Python string (.py)</option>
        <option value="ruby">Ruby string (.rb)</option>
      </select>
    </label>
    <fieldset>
      <legend>Architecture</legend>
      <label><input type="radio" name="import-arch" value="x86" required> x86 (32-bit)</label>
      <label><input type="radio" name="import-arch" value="x64"> x64</label>
      <label><input type="radio" name="import-arch" value="arm64"> ARM64</label>
    </fieldset>
    <label class="field">Base address
      <input id="import-address" spellcheck="false">
    </label>
    <p id="import-error" class="error" hidden></p>
    <div class="actions">
      <button type="button" id="import-cancel">Cancel</button>
      <button type="submit" class="primary" id="import-submit">Import</button>
    </div>
  </form>
</dialog>
<script>
const $ = (id) => document.getElementById(id);
const archEl = $("arch"), addrEl = $("address"), statusEl = $("status"), gutterEl = $("gutter");

// Address of each line, from the last conversion (null for blank lines).
let addresses = [];

// Per-line state for each side: "ok", "bad" (invalid input) or "unknown" (??? placeholder).
const panes = {
  asm: { input: $("asm"), view: $("asm-view"), states: [] },
  hex: { input: $("hex"), view: $("hex-view"), states: [] },
};
// The comments column is a free-text per-line annotation, aligned to the
// assembly lines by index. It never affects assembly, bytes or addresses.
const commentsEl = $("comments");

// The side the user last typed in is the source; the other side is regenerated.
let source = "asm";
let timer = null;
let requestId = 0;

function escapeHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
}

const INDENT = "  ";
const LABEL_DEF = /^(\s*)([A-Za-z_.$][\w.$]*)(\s*:)(?!:)/;
const LABEL_ONLY = /^\s*([A-Za-z_.$][\w.$]*\s*:(?!:)\s*)+$/;

function stripComment(line) {
  const i = line.indexOf("//");
  return i < 0 ? [line, ""] : [line.slice(0, i), line.slice(i)];
}

function definedLabels(lines) {
  const names = new Set();
  for (const line of lines) {
    let [code] = stripComment(line), m;
    while ((m = LABEL_DEF.exec(code))) {
      names.add(m[2]);
      code = code.slice(m[0].length);
    }
  }
  return names;
}

function labelRefPattern(names) {
  if (!names.size) return null;
  const alts = [...names].sort((a, b) => b.length - a.length).map((n) => n.replace(/[.$]/g, "\\$&"));
  return new RegExp(`(?<![\\w.$])(?:${alts.join("|")})(?![\\w.$])`, "g");
}

function highlightRefs(text, pattern) {
  if (!pattern) return escapeHtml(text);
  let out = "", last = 0;
  for (const m of text.matchAll(pattern)) {
    out += escapeHtml(text.slice(last, m.index)) + `<span class="label-ref">${escapeHtml(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + escapeHtml(text.slice(last));
}

// Color label definitions, references to defined labels, and comments.
function highlightAsm(line, refPattern) {
  let [code, comment] = stripComment(line), m, html = "";
  while ((m = LABEL_DEF.exec(code))) {
    html += escapeHtml(m[1]) + `<span class="label">${escapeHtml(m[2])}</span>` + escapeHtml(m[3]);
    code = code.slice(m[0].length);
  }
  // Skip the mnemonic of each statement, so a label named e.g. "loop" only
  // lights up where it's used as an operand.
  html += code.split(";").map((stmt) => {
    const head = /^\s*\S*/.exec(stmt)[0];
    return escapeHtml(head) + highlightRefs(stmt.slice(head.length), refPattern);
  }).join(";");
  if (comment) html += `<span class="comment">${escapeHtml(comment)}</span>`;
  return html;
}

// --- byte highlighting ---------------------------------------------------

// Bytes the user asked to highlight in the bytes pane.
let highlight = new Set();

// Parse the highlight bar: ASCII characters, \xNN and 0xNN. Whitespace and
// commas separate entries. Returns {bytes: Set} or {error}.
function parseByteList(s) {
  const bytes = new Set();
  let i = 0, m;
  while (i < s.length) {
    const rest = s.slice(i);
    if ((m = /^\\x([0-9a-f]{2})/i.exec(rest)) || (m = /^0x([0-9a-f]{1,2})(?![0-9a-f])/i.exec(rest))) {
      bytes.add(parseInt(m[1], 16));
      i += m[0].length;
    } else if (/^0x[0-9a-f]/i.test(rest)) {
      return { error: "0x takes one or two hex digits" };
    } else if (rest.startsWith("\\\\")) {
      bytes.add(0x5c);
      i += 2;
    } else if (rest[0] === "\\") {
      return { error: "After \\ use xNN, or \\\\ for a backslash" };
    } else if (/[\s,]/.test(rest[0])) {
      i++;
    } else {
      const c = s.charCodeAt(i);
      if (c < 0x20 || c > 0x7e) return { error: `"${rest[0]}" is not printable ASCII` };
      bytes.add(c);
      i++;
    }
  }
  return { bytes };
}

// One byte in the bytes pane, in any accepted form: "48", "0x48" or "\x48".
const BYTE_TOKEN = /(?:0x|\\x)?([0-9a-f]{2})/gi;

function lineBytes(line) {
  return [...stripComment(line)[0].matchAll(BYTE_TOKEN)].map((m) => parseInt(m[1], 16));
}

function highlightBytes(line) {
  const [code, comment] = stripComment(line);
  let out = "", last = 0;
  for (const m of code.matchAll(BYTE_TOKEN)) {
    if (!highlight.has(parseInt(m[1], 16))) continue;
    out += escapeHtml(code.slice(last, m.index)) + `<span class="hit">${escapeHtml(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + escapeHtml(code.slice(last)) + escapeHtml(comment);
}

function render(pane) {
  const lines = pane.input.value.split("\n");
  const refs = pane === panes.asm ? labelRefPattern(definedLabels(lines)) : null;
  pane.view.innerHTML = lines.map((line, i) => {
    const state = pane.states[i];
    if (state && state !== "ok") return `<span class="${state}">${escapeHtml(line)}</span>`;
    if (pane === panes.asm) return highlightAsm(line, refs);
    return highlight.size ? highlightBytes(line) : escapeHtml(line);
  }).join("\n") + "\n";
  syncScroll(pane);
}

function renderGutter() {
  const count = panes.asm.input.value.split("\n").length;
  // Pad to the pointer size: 4 bytes on x86, 8 bytes on x64 and ARM64.
  const width = archEl.value === "x86" ? 8 : 16;
  const rows = [];
  for (let i = 0; i < count; i++) {
    const a = addresses[i];
    rows.push(a == null ? "" : a.toString(16).padStart(width, "0"));
  }
  gutterEl.textContent = rows.join("\n") + "\n";
  gutterEl.scrollTop = panes.asm.input.scrollTop;
}

function syncScroll(pane) {
  pane.view.scrollTop = pane.input.scrollTop;
  pane.view.scrollLeft = pane.input.scrollLeft;
}

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || "";
}

const DEFAULT_ADDRESS = 0x1000;

function parseAddress() {
  const s = addrEl.value.trim();
  if (!s) return DEFAULT_ADDRESS;
  const n = /^0x[0-9a-f]+$/i.test(s) ? parseInt(s, 16) : /^\d+$/.test(s) ? parseInt(s, 10) : NaN;
  return Number.isSafeInteger(n) ? n : null;
}

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`Server error ${res.status}`);
  return res.json();
}

async function convert() {
  const address = parseAddress();
  if (address === null) return setStatus("Invalid base address", "error");
  const arch = archEl.value;
  if (arch === "x86" && address > 0xffffffff) return setStatus("Base address doesn't fit in 32 bits", "error");
  const from = panes[source];
  const to = panes[source === "asm" ? "hex" : "asm"];
  const id = ++requestId;
  try {
    const path = source === "asm" ? "/api/assemble" : "/api/disassemble";
    const r = await post(path, { arch, address, lines: from.input.value.split("\n") });
    if (id !== requestId) return;
    const field = source === "asm" ? "bytes" : "text";
    from.states = r.lines.map((l) => (l.ok ? "ok" : "bad"));
    to.states = r.lines.map((l) => (l.ok ? "ok" : "unknown"));
    to.input.value = r.lines.map((l) => {
      const text = l.ok ? l[field] : "???";
      // Disassembly has no labels, so indent every instruction to match.
      return source === "hex" && text ? INDENT + text : text;
    }).join("\n");
    // Replacing the text resets its scroll position; keep the panes aligned.
    to.input.scrollTop = from.input.scrollTop;
    addresses = r.lines.map((l) => l.address);
    render(from);
    render(to);
    renderGutter();
    report(r.lines);
    saveSession();
  } catch (e) {
    if (id === requestId) setStatus(e.message, "error");
  }
}

// Results of the last conversion, so the status can be redrawn when the
// highlight bar changes.
let lastLines = [];

function report(lines) {
  lastLines = lines;
  const errors = lines.map((l, i) => [i + 1, l]).filter(([, l]) => !l.ok);
  const bytes = panes.hex.input.value.split("\n").filter((_, i) => lines[i]?.ok).flatMap(lineBytes);
  if (errors.length) {
    const [line, first] = errors[0];
    const more = errors.length > 1 ? ` (+${errors.length - 1} more)` : "";
    setStatus(`Line ${line}: ${first.error}${more}`, "error");
  } else {
    const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
    const hits = bytes.filter((b) => highlight.has(b)).length;
    setStatus(plural(bytes.length, "byte") + (highlight.size ? ` · ${plural(hits, "highlighted byte")}` : ""), "ok");
  }
}

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(convert, 200);
}

for (const [name, pane] of Object.entries(panes)) {
  pane.input.addEventListener("input", (e) => {
    if (name === "asm" && !e.inputType?.startsWith("history")) autoIndent(pane.input);
    source = name;
    render(pane);
    if (name === "asm") renderGutter();
    schedule();
  });
  pane.input.addEventListener("scroll", () => {
    syncScroll(pane);
    syncVScroll(pane.input);
  });
}

// All three columns and the address gutter scroll together, line for line.
const vScrollEls = [panes.asm.input, panes.hex.input, commentsEl];
function syncVScroll(src) {
  for (const el of vScrollEls) {
    if (el !== src && el.scrollTop !== src.scrollTop) el.scrollTop = src.scrollTop;
  }
  if (gutterEl.scrollTop !== src.scrollTop) gutterEl.scrollTop = src.scrollTop;
}
commentsEl.addEventListener("scroll", () => syncVScroll(commentsEl));
commentsEl.addEventListener("input", saveSession);
// Insert text at the cursor as if typed, so it stays in the undo history.
function insertText(el, text) {
  if (!document.execCommand("insertText", false, text)) {
    el.setRangeText(text, el.selectionStart, el.selectionEnd, "end");
    el.dispatchEvent(new Event("input"));
  }
}

// Auto-indent: labels sit at the left edge and every other non-blank line
// is indented by INDENT. Applied after each edit as a single text insertion,
// so it stays in the undo history (one extra undo step when it changes
// something). Undo/redo themselves are left alone so they can step back.
function indentLine(line) {
  if (!line.trim()) return line;
  const body = line.replace(/^[ \t]+/, "");
  return LABEL_DEF.test(body) ? body : INDENT + body;
}

function autoIndent(el) {
  const oldLines = el.value.split("\n");
  const newLines = oldLines.map(indentLine);
  let first = 0, last = oldLines.length - 1;
  while (first <= last && oldLines[first] === newLines[first]) first++;
  if (first > last) return;
  while (oldLines[last] === newLines[last]) last--;

  // Map a cursor offset in the old text to the new text.
  const mapOffset = (pos) => {
    let offset = 0, newOffset = 0;
    for (let i = 0; i < oldLines.length; i++) {
      const len = oldLines[i].length;
      if (pos <= offset + len) {
        const col = pos - offset;
        const oldIndent = oldLines[i].length - oldLines[i].replace(/^[ \t]+/, "").length;
        const newIndent = newLines[i].length - newLines[i].replace(/^[ \t]+/, "").length;
        const newCol = !oldLines[i].trim() ? col : col <= oldIndent ? newIndent : col - oldIndent + newIndent;
        return newOffset + newCol;
      }
      offset += len + 1;
      newOffset += newLines[i].length + 1;
    }
    return newOffset;
  };
  const selStart = mapOffset(el.selectionStart), selEnd = mapOffset(el.selectionEnd);

  const lineOffset = (lines, n) => lines.slice(0, n).reduce((sum, l) => sum + l.length + 1, 0);
  const from = lineOffset(oldLines, first);
  const to = lineOffset(oldLines, last) + oldLines[last].length;
  el.setSelectionRange(from, to);
  insertText(el, newLines.slice(first, last + 1).join("\n"));
  el.setSelectionRange(selStart, selEnd);
}

panes.asm.input.addEventListener("keydown", (e) => {
  if (e.isComposing || e.altKey || e.ctrlKey || e.metaKey) return;
  const el = e.target, v = el.value, start = el.selectionStart;
  if (start !== el.selectionEnd) return;
  const lineStart = v.lastIndexOf("\n", start - 1) + 1;
  const before = v.slice(lineStart, start);

  if (e.key === "Enter" && !e.shiftKey) {
    // New lines are for instructions; typing a label there moves it left.
    e.preventDefault();
    insertText(el, "\n" + INDENT);
  } else if (e.key === "Backspace" && before && !before.trim() && lineStart > 0) {
    // Inside the indent the indent would just come back, so join this line
    // onto the previous one instead.
    e.preventDefault();
    el.setSelectionRange(lineStart - 1, start);
    if (!document.execCommand("delete")) {
      el.setRangeText("", lineStart - 1, start, "end");
      el.dispatchEvent(new Event("input"));
    }
  }
});

// --- export ---------------------------------------------------------------

const exportBtn = $("export"), exportFormatEl = $("export-format"), exportAsmEl = $("export-asm");

function updateExportLabel() {
  // NASM has no ARM support, so ARM64 exports GNU as syntax instead.
  exportAsmEl.textContent = archEl.value === "arm64" ? "GNU as (.s)" : "NASM (.asm)";
}

async function downloadExport() {
  const address = parseAddress();
  if (address === null) return setStatus("Invalid base address", "error");
  exportBtn.disabled = true;
  try {
    const res = await fetch("/api/export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        arch: archEl.value, address, format: exportFormatEl.value,
        lines: mergedExportLines(),
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      return setStatus(`Can't export: ${body.error || `server error ${res.status}`}`, "error");
    }
    const name = /filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "")?.[1] || "shellcode";
    const url = URL.createObjectURL(await res.blob());
    const a = Object.assign(document.createElement("a"), { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    setStatus(`Can't export: ${e.message}`, "error");
  } finally {
    exportBtn.disabled = false;
  }
}

// Fold each line's note into the assembly as an inline // comment, so the
// existing exporters carry it into the file next to that line's bytes.
function mergedExportLines() {
  const asm = panes.asm.input.value.split("\n");
  const notes = commentsEl.value.split("\n");
  return asm.map((line, i) => {
    const note = (notes[i] || "").trim();
    if (!note) return line;
    const [code, inline] = stripComment(line);
    const existing = inline.replace(/^\/\/\s*/, "").trim();
    const text = existing ? `${existing} -- ${note}` : note;
    return `${code.replace(/\s+$/, "")}  // ${text}`;
  });
}

exportBtn.addEventListener("click", downloadExport);

// --- import ---------------------------------------------------------------

const importDialog = $("import-dialog"), importForm = $("import-form");
const importFileEl = $("import-file"), importTextEl = $("import-text"), importFormatEl = $("import-format");
const importAddrEl = $("import-address"), importErrorEl = $("import-error"), importSubmit = $("import-submit");
const IMPORT_FORMATS = { bin: "bin", asm: "nasm", nasm: "nasm", s: "gas", py: "python", rb: "ruby" };

function importError(message) {
  importErrorEl.textContent = message;
  importErrorEl.hidden = !message;
}

$("import-open").addEventListener("click", () => {
  importForm.reset();
  importError("");
  importAddrEl.value = addrEl.value;
  importDialog.showModal();
});
$("import-cancel").addEventListener("click", () => importDialog.close());

// A file and pasted text are alternatives; picking one clears the other.
importFileEl.addEventListener("change", () => {
  importTextEl.value = "";
  const ext = importFileEl.files[0]?.name.split(".").pop().toLowerCase();
  if (IMPORT_FORMATS[ext]) importFormatEl.value = IMPORT_FORMATS[ext];
});
importTextEl.addEventListener("input", () => { importFileEl.value = ""; });

function toBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}

importForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  importError("");
  const arch = importForm.elements["import-arch"].value;
  const format = importFormatEl.value;
  const file = importFileEl.files[0];
  const saved = addrEl.value;
  addrEl.value = importAddrEl.value;
  const address = parseAddress();
  addrEl.value = saved;
  if (!arch) return importError("Choose an architecture.");
  if (!format) return importError("Choose a format.");
  if (address === null) return importError("Invalid base address.");
  if (!file && !importTextEl.value.trim()) return importError("Choose a file or paste its contents.");
  if (format === "bin" && !file) return importError("Raw binary needs a file.");

  const body = { arch, address, format };
  try {
    if (format === "bin") body.data_base64 = toBase64(await file.arrayBuffer());
    else body.text = file ? await file.text() : importTextEl.value;
  } catch (err) {
    return importError(`Couldn't read the file: ${err.message}`);
  }

  importSubmit.disabled = true;
  try {
    const res = await fetch("/api/import", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const r = await res.json().catch(() => ({}));
    if (!res.ok) return importError(r.error || r.detail?.[0]?.msg || `Server error ${res.status}`);
    importDialog.close();
    await applyImport(arch, address, r.lines, r.notes || []);
  } catch (err) {
    importError(err.message);
  } finally {
    importSubmit.disabled = false;
  }
});

// Imported comments go into the Comments column, not inline in the assembly.
function splitImported(lines) {
  const codes = [], notes = [];
  for (const line of lines) {
    const [code, inline] = stripComment(line);
    codes.push(code.replace(/\s+$/, ""));
    notes.push(inline.replace(/^\/\/\s*/, "").trim());
  }
  return { codes, notes };
}

async function applyImport(arch, address, lines, infoNotes) {
  archEl.value = arch;
  addrEl.value = "0x" + address.toString(16);
  updateExportLabel();
  const { codes, notes } = splitImported(lines);
  // Replace the assembly as if typed, so Ctrl+Z brings the old code back.
  const el = panes.asm.input;
  el.focus();
  el.setSelectionRange(0, el.value.length);
  insertText(el, codes.join("\n"));
  el.setSelectionRange(0, 0);
  el.scrollTop = 0;
  commentsEl.value = notes.join("\n");
  clearTimeout(timer);
  source = "asm";
  await convert();
  saveSession();
  if (infoNotes.length) setStatus(`${statusEl.textContent} · ${infoNotes.join(" ")}`, statusEl.className);
}
archEl.addEventListener("change", updateExportLabel);
updateExportLabel();

archEl.addEventListener("change", convert);
addrEl.addEventListener("input", schedule);

const hlEl = $("hl"), hlParsedEl = $("hl-parsed");
const HL_KEY = "shelldev.highlight";

function updateHighlight() {
  const r = parseByteList(hlEl.value);
  hlEl.classList.toggle("invalid", !!r.error);
  hlParsedEl.classList.toggle("error", !!r.error);
  if (r.error) {
    hlParsedEl.textContent = r.error;
    return; // keep the last valid set while the user fixes the input
  }
  highlight = r.bytes;
  hlParsedEl.textContent = [...highlight].sort((a, b) => a - b)
    .map((b) => b.toString(16).padStart(2, "0")).join(" ");
  try { localStorage.setItem(HL_KEY, hlEl.value); } catch {}
  render(panes.hex);
  if (lastLines.length) report(lastLines);
}

// Default to the classic bad characters: NUL, CR and LF. A saved entry
// (even an empty one the user cleared) takes precedence.
hlEl.value = "\\x00 \\x0D \\x0A";
try {
  const saved = localStorage.getItem(HL_KEY);
  if (saved !== null) hlEl.value = saved;
} catch {}
hlEl.addEventListener("input", updateHighlight);
updateHighlight();

// The editor (code + notes + arch + address) is saved in this browser so a
// reload restores it. A library pick takes precedence over the saved session.
const SESSION_KEY = "shelldev.session";

function saveSession() {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      arch: archEl.value, address: addrEl.value,
      asm: panes.asm.input.value, comments: commentsEl.value,
    }));
  } catch {}
}

function restoreSession() {
  let s;
  try { s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch { return; }
  if (!s || typeof s.asm !== "string") return;
  if (["x86", "x64", "arm64"].includes(s.arch)) archEl.value = s.arch;
  if (typeof s.address === "string" && s.address.trim()) addrEl.value = s.address;
  panes.asm.input.value = s.asm;
  commentsEl.value = typeof s.comments === "string" ? s.comments : "";
}

// A shellcode chosen on the library page arrives via localStorage.
function loadPending() {
  let pending;
  try {
    const raw = localStorage.getItem("shelldev.load");
    if (!raw) return false;
    localStorage.removeItem("shelldev.load");
    pending = JSON.parse(raw);
  } catch { return false; }
  const hasAsm = typeof pending.asm === "string";
  const hasBytes = Array.isArray(pending.bytes_lines);
  if (!["x86", "x64", "arm64"].includes(pending.arch) || (!hasAsm && !hasBytes)) return false;
  archEl.value = pending.arch;
  if (Number.isSafeInteger(pending.address) && pending.address >= 0) {
    addrEl.value = "0x" + pending.address.toString(16);
  }
  commentsEl.value = "";
  if (hasBytes) {
    // Raw-bytes entry: load the bytes and let the editor disassemble them.
    panes.hex.input.value = pending.bytes_lines.join("\n");
    source = "hex";
  } else {
    // Move the entry's inline comments into the Comments column, like import.
    const { codes, notes } = splitImported(pending.asm.split("\n"));
    panes.asm.input.value = codes.join("\n");
    commentsEl.value = notes.join("\n");
    source = "asm";
  }
  updateExportLabel();
  if (pending.name) setStatus(`Loaded "${pending.name}" from the library`, "ok");
  return true;
}

if (!loadPending()) restoreSession();
render(panes.asm);
convert();
</script>
</body>
</html>
